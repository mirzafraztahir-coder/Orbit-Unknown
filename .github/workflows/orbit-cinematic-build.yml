name: Orbit Cinematic Build

on:
  workflow_dispatch:
  schedule:
    # 07:00 Pakistan time = 02:00 UTC.
    - cron: "0 2 * * *"
  push:
    branches: [main]
    paths:
      - "automation/space_cinematic_v2.py"
      - ".github/workflows/orbit-cinematic-build.yml"

permissions:
  contents: write

concurrency:
  group: orbit-cinematic-build
  cancel-in-progress: false

jobs:
  produce:
    name: Generate and verify cinematic short (no publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - name: Install video software and narration dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt "numpy==1.26.4" "edge-tts>=6.1,<8"
      - name: Generate five unique NASA scene images, narrated 40s MP4, and captions
        id: generate
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python automation/space_cinematic_v2.py
      - name: Verify complete today's media package (does not publish)
        id: verify
        run: |
          python - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          pkt = timezone(timedelta(hours=5))
          today = datetime.now(pkt).date().isoformat()
          meta = json.loads(Path("outbox/latest.json").read_text())
          qa = json.loads(Path("outbox/quality_report.json").read_text())
          video = Path("outbox/latest.mp4")
          assert meta["edition_date_pkt"] == today, "Stale metadata date"
          assert qa["edition_date_pkt"] == today, "Stale quality report"
          assert qa["status"] == "technical_checks_passed"
          assert qa["scene_count"] == 5
          assert video.stat().st_size > 350000
          assert hashlib.sha256(video.read_bytes()).hexdigest() == qa["sha256"], "Hash mismatch"
          print("VERIFIED EDITION:", today, meta["metadata"]["title"], "bytes:", video.stat().st_size)
          PY
      - name: Save verified video for 08:00 publishing workflow
        uses: actions/upload-artifact@v4
        with:
          name: orbit-ready-${{ github.run_id }}
          path: |
            outbox/latest.mp4
            outbox/latest.json
            outbox/quality_report.json
            outbox/nasa_credits.json
          retention-days: 5
          if-no-files-found: error
      - name: Commit build status for remote verification
        # This diagnostic step must never fail an already validated video artifact.
        continue-on-error: true
        if: always()
        env:
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p ops
          python - <<'PY'
          import datetime,json,os
          from pathlib import Path
          now=datetime.datetime.now(datetime.timezone.utc)
          report={"run_id":os.getenv("RUN_ID"),"utc":now.isoformat(),
                  "date_pkt":(now+datetime.timedelta(hours=5)).date().isoformat(),
                  "status":os.getenv("JOB_STATUS"),"generation":os.getenv("GENERATE_OUTCOME"),
                  "verification":os.getenv("VERIFY_OUTCOME"),
                  "title":None}
          p=Path("outbox/latest.json")
          if p.is_file():
              try: report["title"]=json.loads(p.read_text()).get("topic")
              except Exception: pass
          Path("ops/latest_build.json").write_text(json.dumps(report,indent=2)+"\n")
          print("BUILD STATUS:",json.dumps(report))
          PY
          git config user.name "orbit-autopilot"
          git config user.email "orbit-autopilot@users.noreply.github.com"
          git add ops/latest_build.json
          git commit -m "Record latest cinematic production status" || true
          # Rendered assets modify tracked outbox files; stash them before rebasing status commit.
          git stash push -m "Temporary rendered video assets" || true
          git pull --rebase origin main
          git push origin HEAD:main || echo "Diagnostic status push conflicted; video artifact remains valid"
