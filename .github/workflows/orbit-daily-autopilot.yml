name: Orbit Daily Autopilot
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Orbit Cinematic Build"]
    types: [completed]
    branches: [main]
  schedule:
    # Primary publication: 09:45 Pakistan time = 04:45 UTC.
    - cron: "45 4 * * *"
    # Recovery attempts at 10:05 and 10:25 PKT if YouTube did not confirm success.
    - cron: "5,25 5 * * *"
permissions:
  contents: write
  actions: read
concurrency:
  group: orbit-youtube-daily-publish
  cancel-in-progress: false
jobs:
  publish-verified-edition:
    # A successful late build can publish immediately after 09:45 PKT.
    # Earlier builds wait for the scheduled 08:00 PKT publishing window.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Delay workflow-triggered uploads until 09:45 PKT
        id: opening
        run: |
          NOW="$(TZ=Asia/Karachi date +%H%M)"
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "$NOW" -lt 0945 ]; then
            echo "too_early=true" >> "$GITHUB_OUTPUT"
            echo "Cinematic build finished early; publication waits until 09:45 PKT."
          else
            echo "too_early=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Guard against duplicate publication today
        if: steps.opening.outputs.too_early != 'true'
        id: guard
        run: |
          TODAY="$(TZ=Asia/Karachi date +%F)"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ -s "published/$TODAY.json" ]; then
            echo "Already published $TODAY; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download last successful cinematic build
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p outbox
          rm -f outbox/latest.mp4 outbox/latest.json outbox/quality_report.json outbox/youtube_result.json
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/orbit-cinematic-build.yml/runs?status=completed&per_page=40" --jq '.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main") | .id' | head -n 1)"
          if [ -z "$RUN_ID" ]; then
            echo "::error::No completed successful cinematic build. Will retry next slot."
            exit 1
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "orbit-ready-$RUN_ID" --dir outbox
          test -s outbox/latest.mp4
          test -s outbox/latest.json
          test -s outbox/quality_report.json
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: "3.11"
      - name: Install YouTube dependencies
        if: steps.guard.outputs.skip == 'false'
        run: pip install -r automation/requirements.txt
      - name: Ensure media verification utilities are available
        if: steps.guard.outputs.skip == 'false'
        run: |
          command -v gh
          command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Validate media, today's date, and topic uniqueness
        if: steps.guard.outputs.skip == 'false'
        run: |
          python - <<'PY'
          import hashlib,json,subprocess,datetime
          from pathlib import Path
          today=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=5))).date()
          pkg=json.loads(Path("outbox/latest.json").read_text())
          report=json.loads(Path("outbox/quality_report.json").read_text())
          vid=Path("outbox/latest.mp4")
          if pkg.get("edition_date_pkt")!=today.isoformat() or report.get("edition_date_pkt")!=today.isoformat():
              raise SystemExit("QUALITY GATE: stale edition; not uploading")
          if report.get("status")!="technical_checks_passed" or report.get("scene_count")!=5:
              raise SystemExit("QUALITY GATE: no validated independent images")
          if hashlib.sha256(vid.read_bytes()).hexdigest()!=report.get("sha256"):
              raise SystemExit("QUALITY GATE: video SHA256 changed")
          info=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(vid)]))
          video=next((s for s in info["streams"] if s["codec_type"]=="video"),None)
          audio=next((s for s in info["streams"] if s["codec_type"]=="audio"),None)
          if not video or not audio or (video["width"],video["height"])!=(720,1280):
              raise SystemExit("QUALITY GATE: wrong format or missing audio")
          if abs(float(info["format"]["duration"])-40)>.5:
              raise SystemExit("QUALITY GATE: invalid duration")
          yesterday=Path("published")/((today-datetime.timedelta(days=1)).isoformat()+".json")
          if yesterday.is_file() and json.loads(yesterday.read_text()).get("topic")==pkg["topic"]:
              raise SystemExit("QUALITY GATE: topic already published yesterday")
          print("QUALITY GATE PASSED", pkg["topic"])
          PY
      - name: Require valid YouTube credentials
        if: steps.guard.outputs.skip == 'false'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"
          test -n "$YOUTUBE_REFRESH_TOKEN"
      - name: Publish the approved Short to YouTube
        if: steps.guard.outputs.skip == 'false'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python automation/publish_youtube.py outbox/latest.json outbox/latest.mp4
      - name: Save YouTube ID and prevent subsequent duplicate uploads
        if: steps.guard.outputs.skip == 'false'
        run: |
          python - <<'PY'
          import json,datetime
          from pathlib import Path
          today=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=5))).date().isoformat()
          receipt=Path("outbox/youtube_result.json")
          if not receipt.is_file(): raise SystemExit("YouTube did not return result")
          video_id=json.loads(receipt.read_text()).get("id")
          if not video_id: raise SystemExit("YouTube upload lacks video ID")
          pkg=json.loads(Path("outbox/latest.json").read_text())
          report=json.loads(Path("outbox/quality_report.json").read_text())
          result={"date_pkt":today,"video_id":video_id,"url":"https://www.youtube.com/shorts/"+video_id,"topic":pkg["topic"],"sha256":report["sha256"],"published_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()}
          Path("published").mkdir(exist_ok=True)
          (Path("published")/(today+".json")).write_text(json.dumps(result,indent=2)+"\n")
          print("CONFIRMED YOUTUBE PUBLICATION",result["url"])
          PY
          git config user.name "orbit-autopilot"
          git config user.email "orbit-autopilot@users.noreply.github.com"
          git add published/
          git commit -m "Orbit verified YouTube upload"
          # The fresh artifact also changes tracked outbox files in this checkout.
          # Stash those uncommitted build files before recording the receipt.
          git stash push -m "Temporary publish artifacts" || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Archive successful YouTube receipt
        if: steps.guard.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: orbit-published-${{ github.run_id }}
          path: |
            published/
            outbox/quality_report.json
            outbox/youtube_result.json
          retention-days: 30
